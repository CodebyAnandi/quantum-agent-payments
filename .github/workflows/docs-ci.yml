name: docs-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --accept 200,206,403,429 "**/*.md"
          fail: true
